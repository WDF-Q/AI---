<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 賓果彩虹消消樂 - 同心輪盤版</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=7">
<script>window.onerror = function(msg, url, line, col, error) { fetch('http://127.0.0.1:8001/error', {method:'POST', body: msg + ' at ' + line + ':' + col}); return false; };</script></head>
<body>
    <div class="app-wrapper">
        <!-- 頂部資訊列 -->
        <header class="top-bar">
            <div class="title-section">
                <h1>🌈 <span style="font-size: 0.5em;">賓果彩虹</span></h1>
            </div>
            <div class="info-section">
                <div class="credit-box">
                    <span>CREDIT (總餘額)</span>
                    <span id="credit-display" class="value highlight">10000</span>
                </div>
                <div class="win-box">
                    <span>WIN (贏分)</span>
                    <span id="win-display" class="value win-highlight">0</span>
                </div>
            </div>
        </header>

        <!-- 遊戲主要區塊 -->
        <main class="game-container">
            
            <!-- LEFT PANEL: Roulette & Betting -->
            <div class="left-panel">
                
                <!-- 狀態顯示與發球指示 -->
                <div class="status-panel">
                    <h3>目前狀態</h3>
                    <div id="draw-status" class="draw-status" style="margin-bottom: 10px; color: #fff; font-size: 1.1rem; font-weight: bold;">等待開始...</div>
                    <div id="safe-indicator" class="safe-indicator">前 3 球安全保障！</div>
                    
                    <!-- 蘋果收集進度 -->
                    <div class="apple-bonus-tracker" style="margin-top: 10px; display: flex; gap: 5px; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 8px;">
                        <span style="font-size: 0.9rem; color: #cbd5e1;">蘋果進度:</span>
                        <div id="apple-icons" style="display: flex; gap: 3px;">
                            <span class="apple-icon dim">🍎</span>
                            <span class="apple-icon dim">🍎</span>
                            <span class="apple-icon dim">🍎</span>
                            <span class="apple-icon dim">🍎</span>
                            <span class="apple-icon dim">🍎</span>
                            <span class="apple-icon dim">🍎</span>
                            <span class="apple-icon dim">🍎</span>
                        </div>
                        <button id="btn-debug-apple" style="padding: 2px 5px; font-size: 0.8rem; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px;">+1(測)</button>
                    </div>
                </div>

                <div class="roulette-wrapper-horizontal" style="display: flex; flex-direction: row; align-items: stretch; gap: 10px; margin-bottom: 20px;">
                    <!-- 炫酷大轉盤 -->
                    <div class="roulette-container" style="margin-bottom: 0;">
                        <div class="fire-box" id="fire-box">WAIT</div>
                        <div class="roulette-wheel-wrapper">
                            <!-- 閃爍背景 -->
                            <div class="sp-flash-bg"></div>
                            <!-- 外圈大轉盤 -->
                            <div class="roulette-wheel-outer" id="roulette-wheel-outer"></div>
                            <!-- 內圈小轉盤 -->
                            <div class="roulette-wheel-inner" id="roulette-wheel-inner">
                                <div class="inner-borders"></div>
                            </div>
                        </div>
                        <div class="roulette-result-box" id="roulette-result-box">
                            進洞顏色：<span id="roulette-result-text">等待發球</span>
                        </div>
                    </div>
                </div>
                
                <!-- 小遊戲區域 (預設隱藏) -->
                <div id="mini-game-panel" class="mini-game-panel hidden" style="background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid #4ade80;">
                    <h3 style="color: #4ade80; text-align: center; margin-bottom: 10px; text-shadow: 0 0 5px #4ade80; font-size: 1.1rem;">✨ JP 遊戲 (剩 <span id="mg-rounds-left">3</span> 局) ✨</h3>
                    
                    <!-- 顏色步數提示板 -->
                    <div id="mg-color-rules" style="display: flex; justify-content: space-around; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; margin-bottom: 25px; font-weight: bold; font-size: 0.9rem;">
                        <!-- JS 動態填入 -->
                    </div>
                    
                    <!-- 長條圖軌道 -->
                    <div class="mg-track-container" style="position: relative; width: 100%; height: 25px; background: #111; border-radius: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); border: 2px solid #333;">
                        <!-- 填滿進度條 -->
                        <div id="mg-progress-fill" style="position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: linear-gradient(90deg, #16a34a, #4ade80); border-radius: 15px; transition: width 0.5s ease-out;"></div>
                        
                        <!-- 站點標記 -->
                        <div class="mg-stations" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none;">
                            <div class="mg-station" style="left: 0%; position: absolute; top: 100%; transform: translateX(-50%); font-size: 0.8rem; color: #94a3b8; margin-top: 2px;">0島</div>
                            <div class="mg-station" style="left: 14.28%; position: absolute; top: 100%; transform: translateX(-50%); font-size: 0.8rem; color: #94a3b8; margin-top: 2px;">20島</div>
                            <div class="mg-station" style="left: 35.71%; position: absolute; top: 100%; transform: translateX(-50%); font-size: 0.8rem; color: #94a3b8; margin-top: 2px;">50島</div>
                            <div class="mg-station" style="left: 64.28%; position: absolute; top: 100%; transform: translateX(-50%); font-size: 0.8rem; color: #94a3b8; margin-top: 2px;">90島</div>
                            <div class="mg-station" style="left: 100%; position: absolute; top: 100%; transform: translateX(-50%); font-size: 0.8rem; color: #facc15; margin-top: 2px; font-weight: bold;">140島</div>
                            
                            <!-- 垂直標記線 -->
                            <div style="position: absolute; left: 0%; height: 100%; width: 4px; background: rgba(255,255,255,0.6); transform: translateX(-50%);"></div>
                            <div style="position: absolute; left: 14.28%; height: 100%; width: 4px; background: rgba(255,255,255,0.6); transform: translateX(-50%);"></div>
                            <div style="position: absolute; left: 35.71%; height: 100%; width: 4px; background: rgba(255,255,255,0.6); transform: translateX(-50%);"></div>
                            <div style="position: absolute; left: 64.28%; height: 100%; width: 4px; background: rgba(255,255,255,0.6); transform: translateX(-50%);"></div>
                            <div style="position: absolute; left: 100%; height: 100%; width: 4px; background: rgba(255,255,255,0.6); transform: translateX(-50%);"></div>
                        </div>
                        
                        <!-- 小狗公仔與步數計數器 -->
                        <div id="mg-dog-container" style="position: absolute; top: -35px; left: 0%; transform: translateX(-50%); transition: left 0.5s linear; z-index: 10; display: flex; align-items: center; gap: 5px;">
                            <div id="mg-dog-counter" style="background: rgba(0,0,0,0.7); color: #4ade80; padding: 2px 6px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; border: 1px solid #4ade80; text-shadow: none;">0</div>
                            <div id="mg-dog" style="transform: scaleX(-1); font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">🐕</div>
                        </div>
                    </div>
                </div>
                
                <!-- 押分與控制區 (Moved to right panel) -->
            </div>

            <!-- RIGHT PANEL: Match-3 Board & Combo Ladder -->
            <div class="right-panel">
                <div class="board-with-ladder">
                    <!-- 左側獎勵塔 -->
                    <div class="left-ladder-col">
                        <!-- 蘋果收集槽 (3+1) -->
                        <div class="apple-collection-row" id="apple-collection-row">
                            <div class="apple-slots-group">
                                <div class="apple-slot" id="collected-apple-0"></div>
                                <div class="apple-slot" id="collected-apple-1"></div>
                                <div class="apple-slot" id="collected-apple-2"></div>
                            </div>
                            <div class="apple-slot extra-slot" id="collected-apple-extra"></div>
                        </div>
                        <!-- 左側獎勵塔 -->
                        <div class="combo-ladder">
                        <div class="ladder-step" data-chain="10">
                            <span class="chain-label">10 連鎖</span>
                            <span class="chain-reward" id="reward-10">0</span>
                        </div>
                        <div class="ladder-step" data-chain="9">
                            <span class="chain-label">9 連鎖</span>
                            <span class="chain-reward" id="reward-9">0</span>
                        </div>
                        <div class="ladder-step" data-chain="8">
                            <span class="chain-label">8 連鎖</span>
                            <span class="chain-reward" id="reward-8">0</span>
                        </div>
                        <div class="ladder-step" data-chain="7">
                            <span class="chain-label">7 連鎖</span>
                            <span class="chain-reward" id="reward-7">0</span>
                        </div>
                        <div class="ladder-step" data-chain="6">
                            <span class="chain-label">6 連鎖</span>
                            <span class="chain-reward" id="reward-6">0</span>
                        </div>
                        <div class="ladder-step" data-chain="5">
                            <span class="chain-label">5 連鎖</span>
                            <span class="chain-reward" id="reward-5">0</span>
                        </div>
                        <div class="ladder-step" data-chain="4">
                            <span class="chain-label">4 連鎖</span>
                            <span class="chain-reward" id="reward-4">0</span>
                        </div>
                        <div class="ladder-title">連鎖獎勵塔</div>
                    </div>
                </div>

                    <!-- 遊戲棋盤 -->
                    <div class="board-wrapper">
                        <div id="combo-overlay" class="combo-overlay"></div>
                        <div id="out-overlay" class="out-overlay">OUT</div>
                        <div class="win-drop-zone"></div>
                        <div class="game-board-container">
                            <!-- 鳥嘴與蘋果槽 (6格) -->
                            <div class="bird-mouth-row" id="bird-mouth-row">
                                <div class="bird-mouth-slot"><div id="bird-mouth" class="bird-mouth">SP光束</div></div>
                                <div class="bird-mouth-slot"></div>
                                <div class="bird-mouth-slot"></div>
                                <div class="bird-mouth-slot"></div>
                                <div class="bird-mouth-slot"></div>
                                <div class="bird-mouth-slot"></div>
                            </div>
                            <div class="game-board" id="game-board">
                                <div id="laser-beam" class="laser-beam hidden"></div>
                                <div class="elimination-zone">消除觸發區域</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 底部紀錄統計區 (New HUD) -->
                <div class="bottom-hud-container" style="display: flex; flex-direction: row; align-items: flex-end; gap: 10px; margin-top: 15px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px;">
                    <!-- COUNT block -->
                    <div class="hud-count-box" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 5px;">
                        <span style="font-size: 1rem; font-weight: bold; color: #333; text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;">COUNT</span>
                        <span id="ball-count-text" style="font-size: 2.8rem; font-weight: 900; color: #fff; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; line-height: 0.9;">0</span>
                    </div>

                    <!-- History Trackers + Recent Balls -->
                    <div class="hud-tracker-area" style="display: flex; flex-direction: column; flex-grow: 1;">
                        <!-- Recent Balls Track (The black bar) -->
                        <div class="recent-balls-track" style="background: #111; border-radius: 12px; height: 35px; width: 257px; display: flex; align-items: center; padding: 0 4px; margin-bottom: 2px; justify-content: flex-start; box-sizing: border-box;">
                            <div id="ball-history" class="ball-history-container" style="display: flex; flex-direction: row; gap: 2px; overflow: hidden; width: 100%; height: 100%; padding: 0; align-items: center; justify-content: flex-start; min-height: unset;">
                                <!-- JS 動態產生球 -->
                            </div>
                        </div>
                        
                        <!-- Square Color Trackers -->
                        <div class="square-trackers" style="display: flex; gap: 2px;">
                            <div class="track-square white-block"><span id="track-white" class="track-count">0</span></div>
                            <div class="track-square pink-block"><span id="track-pink" class="track-count">0</span></div>
                            <div class="track-square red-block"><span id="track-red" class="track-count">0</span></div>
                            <div class="track-square yellow-block"><span id="track-yellow" class="track-count">0</span></div>
                            <div class="track-square green-block"><span id="track-green" class="track-count">0</span></div>
                            <div class="track-square blue-block"><span id="track-blue" class="track-count">0</span></div>
                            <div class="track-square rainbow-block"><span id="track-rainbow" class="track-count">0</span></div>
                        </div>
                    </div>
                </div>

                <!-- 押分與控制區 -->
                <div class="controls-panel" style="margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155;">
                    <div class="betting-panel" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div class="bet-display" style="display: flex; align-items: center; gap: 15px;">
                            <span style="color: #94a3b8;">基本押分: 600</span>
                            <span style="font-size: 1.2rem; font-weight: bold; color: #fff;">當前押分: </span>
                            <span id="bet-input" class="bet-value">0</span>
                        </div>
                        <div class="chip-container" style="display: flex; gap: 10px;">
                            <button id="btn-cycle-bet" class="chip-btn" style="width: 150px;">切換加分 (+1)</button>
                            <button id="btn-add-bet" class="chip-btn" style="background: #eab308; color: #000; font-weight: bold;">押分</button>
                        </div>
                    </div>
                    <button id="btn-start" class="btn-start" style="width: 100%; padding: 15px; font-size: 1.2rem;">🚀 開始遊戲 (START)</button>
                </div>
            </div>
            
        </main>
    </div>

    <script src="./script.js?v=7"></script>
</body>
</html>
