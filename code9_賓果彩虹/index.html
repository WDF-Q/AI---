<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賓果彩虹 - 精靈消消樂</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-bg"></div>
    
    <div class="game-wrapper">
        <header class="game-header">
            <h1 class="game-title">✨ BINGO RAINBOW <span>消消樂</span> ✨</h1>
        </header>

        <div class="game-container">
            <!-- Left Panel: Stats and Bets -->
            <aside class="side-panel left-panel glass-panel">
                <div class="credit-box">
                    <div class="label">CREDIT (餘額)</div>
                    <div class="value" id="credit-display">10000</div>
                </div>
                
                <div class="bet-box">
                    <div class="label">BET (押分)</div>
                    <div class="bet-controls">
                        <button class="btn-sm" id="bet-minus">-</button>
                        <input type="number" id="bet-input" value="100" min="10" step="10" readonly>
                        <button class="btn-sm" id="bet-plus">+</button>
                    </div>
                </div>

                <div class="win-box">
                    <div class="label">WIN (得分)</div>
                    <div class="value highlight" id="win-display">0</div>
                </div>

                <div class="combo-ladder">
                    <div class="ladder-step" data-chain="10">
                        <div class="chain-label">10連鎖</div>
                        <div class="reward-ball"><span id="reward-10">1000</span></div>
                    </div>
                    <div class="ladder-step" data-chain="9">
                        <div class="chain-label">9連鎖</div>
                        <div class="reward-ball"><span id="reward-9">500</span></div>
                    </div>
                    <div class="ladder-step" data-chain="8">
                        <div class="chain-label">8連鎖</div>
                        <div class="reward-ball"><span id="reward-8">200</span></div>
                    </div>
                    <div class="ladder-step" data-chain="7">
                        <div class="chain-label">7連鎖</div>
                        <div class="reward-ball"><span id="reward-7">160</span></div>
                    </div>
                    <div class="ladder-step" data-chain="6">
                        <div class="chain-label">6連鎖</div>
                        <div class="reward-ball"><span id="reward-6">120</span></div>
                    </div>
                    <div class="ladder-step" data-chain="5">
                        <div class="chain-label">5連鎖</div>
                        <div class="reward-ball"><span id="reward-5">80</span></div>
                    </div>
                    <div class="ladder-step" data-chain="4">
                        <div class="chain-label">4連鎖</div>
                        <div class="reward-ball"><span id="reward-4">40</span></div>
                    </div>
                </div>
            </aside>

            <!-- Center Panel: The Game Board -->
            <main class="center-panel">
                <div class="board-wrapper">
                    <div class="combo-overlay" id="combo-overlay"></div>
                    <div class="drop-zone-indicator">
                        <span>⏬ 掉落至此即可獲得獎金 WIN ⏬</span>
                    </div>
                    <div class="game-board" id="game-board">
                        <!-- JS generates 8x6 grid here -->
                    </div>
                </div>
            </main>

            <!-- Right Panel: Roulette & Controls -->
            <aside class="side-panel right-panel glass-panel">
                <div class="roulette-section">
                    <h3>落球紀錄 (History)</h3>
                    <div class="ball-history" id="ball-history">
                        <!-- Balls added here -->
                    </div>
                </div>

                <div class="status-section">
                    <div class="safe-indicator" id="safe-indicator">
                        前 3 球安全保障！
                    </div>
                    <div class="draw-status" id="draw-status">
                        等待開始...
                    </div>
                </div>

                <div class="controls-section">
                    <button class="btn-mega" id="btn-start">
                        START <br><small>開始遊戲</small>
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
