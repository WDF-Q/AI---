<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 賓果彩虹消消樂 - 同心輪盤版</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=7">
<script>window.onerror = function(msg, url, line, col, error) { fetch('http://127.0.0.1:8001/error', {method:'POST', body: msg + ' at ' + line + ':' + col}); return false; };</script></head>
<body>
    <div class="app-wrapper">
        <!-- 頂部資訊列 -->
        <header class="top-bar">
            <div class="title-section">
                <h1>🌈 賓果彩虹 <span>Colotta Stone</span></h1>
            </div>
            <div class="info-section">
                <div class="credit-box">
                    <span>CREDIT (總餘額)</span>
                    <span id="credit-display" class="value highlight">10000</span>
                </div>
                <div class="win-box">
                    <span>WIN (贏分)</span>
                    <span id="win-display" class="value win-highlight">0</span>
                </div>
            </div>
        </header>

        <!-- 遊戲主要區塊 -->
        <main class="game-container">
            
            <!-- LEFT PANEL: Roulette & Betting -->
            <div class="left-panel">
                
                <!-- 狀態顯示與發球指示 -->
                <div class="status-panel">
                    <h3>目前狀態</h3>
                    <div id="draw-status" class="draw-status" style="margin-bottom: 10px; color: #fff; font-size: 1.1rem; font-weight: bold;">等待開始...</div>
                    <div id="safe-indicator" class="safe-indicator">前 3 球安全保障！</div>
                    <div class="ball-count-display">投擲球數: <span id="ball-count-text">0</span></div>
                </div>

                <div class="roulette-wrapper-horizontal" style="display: flex; flex-direction: row; align-items: stretch; gap: 10px; margin-bottom: 20px;">
                    <!-- 炫酷大轉盤 -->
                    <div class="roulette-container" style="margin-bottom: 0;">
                        <div class="fire-box" id="fire-box">WAIT</div>
                        <div class="roulette-wheel-wrapper">
                            <!-- 閃爍背景 -->
                            <div class="sp-flash-bg"></div>
                            <!-- 外圈大轉盤 -->
                            <div class="roulette-wheel-outer" id="roulette-wheel-outer"></div>
                            <!-- 內圈小轉盤 -->
                            <div class="roulette-wheel-inner" id="roulette-wheel-inner">
                                <div class="inner-borders"></div>
                            </div>
                        </div>
                        <div class="roulette-result-box" id="roulette-result-box">
                            進洞顏色：<span id="roulette-result-text">等待發球</span>
                        </div>
                    </div>

                    <!-- 近期發球紀錄隊列 (Vertical) -->
                    <div class="recent-draws-panel vertical" style="flex-direction: row; width: 60px; padding: 10px;">
                        <div id="ball-history" class="ball-history-container vertical" style="flex-direction: column; overflow-y: hidden; overflow-x: hidden; width: 100%; min-height: auto; align-items: center;">
                            <!-- JS 動態產生球 -->
                        </div>
                    </div>
                </div>
                
                <!-- 押分與控制區 (Moved to right panel) -->
            </div>

            <!-- RIGHT PANEL: Match-3 Board & Combo Ladder -->
            <div class="right-panel">
                <div class="board-with-ladder">
                    <!-- 左側獎勵塔 -->
                    <div class="combo-ladder">
                        <div class="ladder-step" data-chain="10">
                            <span class="chain-label">10 連鎖</span>
                            <span class="chain-reward" id="reward-10">0</span>
                        </div>
                        <div class="ladder-step" data-chain="9">
                            <span class="chain-label">9 連鎖</span>
                            <span class="chain-reward" id="reward-9">0</span>
                        </div>
                        <div class="ladder-step" data-chain="8">
                            <span class="chain-label">8 連鎖</span>
                            <span class="chain-reward" id="reward-8">0</span>
                        </div>
                        <div class="ladder-step" data-chain="7">
                            <span class="chain-label">7 連鎖</span>
                            <span class="chain-reward" id="reward-7">0</span>
                        </div>
                        <div class="ladder-step" data-chain="6">
                            <span class="chain-label">6 連鎖</span>
                            <span class="chain-reward" id="reward-6">0</span>
                        </div>
                        <div class="ladder-step" data-chain="5">
                            <span class="chain-label">5 連鎖</span>
                            <span class="chain-reward" id="reward-5">0</span>
                        </div>
                        <div class="ladder-step" data-chain="4">
                            <span class="chain-label">4 連鎖</span>
                            <span class="chain-reward" id="reward-4">0</span>
                        </div>
                        <div class="ladder-title">連鎖獎勵塔</div>
                    </div>

                    <!-- 遊戲棋盤 -->
                    <div class="board-wrapper">
                        <div id="combo-overlay" class="combo-overlay"></div>
                        <div id="out-overlay" class="out-overlay">OUT</div>
                        <div class="win-drop-zone"></div>
                        <div class="game-board-container">
                            <div class="bird-mouth-row" id="bird-mouth-row">
                                <div id="bird-mouth" class="bird-mouth"></div>
                            </div>
                            <div class="game-board" id="game-board">
                                <div id="laser-beam" class="laser-beam hidden"></div>
                                <div class="elimination-zone">消除觸發區域</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 底部紀錄統計區 -->
                <div class="history-tracker">
                    <h3>本局發球紀錄統計</h3>
                    <div class="tracker-row">
                        <div class="track-item color-red">
                            <span class="track-icon"></span>
                            <span class="track-count" id="track-red">0</span>
                        </div>
                        <div class="track-item color-pink">
                            <span class="track-icon"></span>
                            <span class="track-count" id="track-pink">0</span>
                        </div>
                        <div class="track-item color-blue">
                            <span class="track-icon"></span>
                            <span class="track-count" id="track-blue">0</span>
                        </div>
                        <div class="track-item color-green">
                            <span class="track-icon"></span>
                            <span class="track-count" id="track-green">0</span>
                        </div>
                        <div class="track-item color-yellow">
                            <span class="track-icon"></span>
                            <span class="track-count" id="track-yellow">0</span>
                        </div>
                        <div class="track-item white-ball">
                            <span class="track-icon">W</span>
                            <span class="track-count" id="track-white">0</span>
                        </div>
                        <div class="track-item rainbow-ball">
                            <span class="track-icon">🌈</span>
                            <span class="track-count" id="track-rainbow">0</span>
                        </div>
                    </div>
                </div>

                <!-- 押分與控制區 -->
                <div class="controls-panel" style="margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155;">
                    <div class="betting-panel" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div class="bet-display" style="display: flex; align-items: center; gap: 15px;">
                            <span style="color: #94a3b8;">基本押分: 600</span>
                            <span style="font-size: 1.2rem; font-weight: bold; color: #fff;">當前押分: </span>
                            <span id="bet-input" class="bet-value">0</span>
                        </div>
                        <div class="chip-container" style="display: flex; gap: 10px;">
                            <button id="btn-cycle-bet" class="chip-btn" style="width: 150px;">切換加分 (+1)</button>
                            <button id="btn-add-bet" class="chip-btn" style="background: #eab308; color: #000; font-weight: bold;">押分</button>
                        </div>
                    </div>
                    <button id="btn-start" class="btn-start" style="width: 100%; padding: 15px; font-size: 1.2rem;">🚀 開始遊戲 (START)</button>
                </div>
            </div>
            
        </main>
    </div>

    <script src="./script.js?v=7"></script>
</body>
</html>
