<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小曹專屬 - 台美股查詢系統</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>股價查詢系統</h1>
                <span class="logo-icon">🌸</span>
            </div>
            <p class="subtitle">為您精心整理的市場動態，最多可同時追蹤 4 檔股票唷 💕</p>
        </header>

        <main class="main-content">
            <section class="control-panel glass-panel">
                <div class="favorites-section">
                    <label for="favorites-dropdown">⭐ 我的最愛：</label>
                    <div class="favorites-controls">
                        <select id="favorites-dropdown" class="dropdown-field">
                            <option value="">-- 選擇已儲存的清單 --</option>
                        </select>
                        <button id="save-favorite-btn" class="btn-secondary" title="儲存當前輸入的代號">
                            ➕ 儲存目前清單
                        </button>
                        <button id="delete-favorite-btn" class="btn-danger" style="display: none;" title="刪除選取的清單">
                            🗑️ 刪除
                        </button>
                    </div>
                    <div id="recent-favorites-container" class="recent-favorites-container">
                        <!-- Recent pills generated here -->
                    </div>
                </div>

                <div class="input-section">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                        <h3 style="margin-bottom: 0;">請輸入股票代號/公司行號</h3>
                        <button id="clear-inputs-btn" class="btn-secondary" style="font-size: 0.85rem; padding: 0.3rem 0.8rem;" title="清空所有輸入框">
                            🧹 清空內容
                        </button>
                    </div>
                    <div class="inputs-grid" id="inputs-container">
                        <!-- Inputs will be generated by JS -->
                    </div>
                </div>

                <div class="settings-section">
                    <h3>資料篩選</h3>
                    <div class="pivot-options">
                        <label class="radio-label">
                            <input type="radio" name="data-mode" value="last_30" checked>
                            <span class="custom-radio"></span>
                            最近 30 個交易日
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="data-mode" value="specific_month">
                            <span class="custom-radio"></span>
                            指定月份
                        </label>
                        <div class="month-selector" id="month-selector" style="display: none;">
                            <input type="month" id="month-input">
                        </div>
                    </div>
                </div>

                <div class="action-section">
                    <button class="btn-primary" id="refresh-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l5.25 4.24"/>
                        </svg>
                        <span>施展魔法更新資料 ✨</span>
                    </button>
                </div>
            </section>

            <section class="results-section" id="results-container">
                <div class="empty-state glass-panel">
                    <div class="empty-icon">🎀</div>
                    <p>請在上方輸入代號或公司行號，並點擊更新按鈕來看股票喔</p>
                </div>
            </section>

            <!-- Chart View (Hidden by default) -->
            <section class="chart-view glass-panel" id="chart-view" style="display: none;">
                <div class="chart-header">
                    <button class="btn-back" id="back-to-table-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        返回表格
                    </button>
                    <div class="chart-title-group">
                        <h2 id="chart-title">公司名稱 / 股票代號</h2>
                        <div class="chart-price-info" id="chart-price-info">
                            <span id="chart-current-price">--</span>
                        </div>
                    </div>
                </div>

                <div class="chart-range-selector">
                    <button class="range-btn" data-range="1D">1D</button>
                    <button class="range-btn" data-range="5D">5D</button>
                    <button class="range-btn active" data-range="1M">1M</button>
                    <button class="range-btn" data-range="6M">6M</button>
                    <button class="range-btn" data-range="YTD">YTD</button>
                    <button class="range-btn" data-range="1Y">1Y</button>
                    <button class="range-btn" data-range="5Y">5Y</button>
                    <button class="range-btn" data-range="Max">Max</button>
                </div>

                <div class="canvas-container">
                    <canvas id="stockChart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script src="./script.js?v=3"></script>
</body>
</html>
