<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 桌面下載器</title>
    <!-- 使用 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-icon">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <h1>YT Downloader</h1>
                <p>全新升級！更快、更穩定的桌面專屬下載器</p>
            </div>

            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon"><i class="fa-solid fa-bolt"></i></div>
                    <h3>極速穩定</h3>
                    <p>告別伺服器塞車，直接由您的電腦進行高畫質下載。</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><i class="fa-solid fa-shield-halved"></i></div>
                    <h3>純淨無廣告</h3>
                    <p>無任何跳轉廣告，專注於下載體驗。</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><i class="fa-solid fa-video"></i></div>
                    <h3>支援多種格式</h3>
                    <p>輕鬆下載 MP4 影片與高音質 MP3。</p>
                </div>
            </div>

            <div class="download-section">
                <!-- 指向即將打包好的 .exe 檔 -->
                <a href="dist/YT_Downloader.exe" id="download-btn" class="btn-primary" download>
                    <i class="fa-brands fa-windows"></i> 下載 Windows 版本
                </a>
                <p class="download-note">支援 Windows 10 / 11 系統<br>初次執行若遇 Windows Defender 警告，請點選「仍要執行」</p>
            </div>
        </div>
        <div class="footer">
            Powered by YT-DLP Core
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
