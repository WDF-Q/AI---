<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小曹的 AI 手作坊</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --text-light: #f8fafc;
            --panel-bg: rgba(30, 41, 59, 0.6);
            --neon-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-darker);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Banner */
        .banner {
            background: linear-gradient(90deg, #0f172a 0%, #1e1b4b 100%);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6), inset 0 -1px 0 rgba(255,255,255,0.1);
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
        }
        
        .banner::before {
            content: '💻';
            font-size: 2.2rem;
            margin-right: 1rem;
            filter: drop-shadow(0 0 8px rgba(56,189,248,0.8));
        }

        .banner h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            letter-spacing: 3px;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(56, 189, 248, 0.2);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            box-shadow: 4px 0 20px rgba(0,0,0,0.3);
            z-index: 5;
        }

        .sidebar-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
        }
        
        .sidebar-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--primary), transparent);
            margin-left: 10px;
            opacity: 0.5;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 1.2rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            transform: scaleY(0);
            transition: transform 0.3s ease;
            border-radius: 4px 0 0 4px;
        }

        .nav-link:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateX(8px);
            box-shadow: var(--neon-shadow);
        }

        .nav-link:hover::before {
            transform: scaleY(1);
        }

        .nav-link.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--primary);
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.1);
        }

        .nav-link.active::before {
            transform: scaleY(1);
        }

        .nav-icon {
            font-size: 1.4rem;
            margin-right: 1rem;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .iframe-wrapper {
            flex: 1;
            border-radius: 16px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(56,189,248,0.1);
            background: #fff; /* White bg so child pages render properly */
            position: relative;
        }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .welcome-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-darker);
            color: var(--primary);
            z-index: 2;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        .welcome-screen h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: var(--neon-shadow);
        }
        
        .welcome-screen p {
            color: var(--text-light);
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Custom Scrollbar for sidebar */
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.3); border-radius: 10px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    </style>
</head>
<body>
    <div class="banner">
        <h1>小曹的 AI 手作坊</h1>
    </div>
    
    <div class="main-container">
        <!-- 左方選單區 -->
        <div class="sidebar">
            <div class="sidebar-title">所有專案列表</div>
            
            <a href="code2-yt下載器/index.html" class="nav-link" target="preview-frame" onclick="setActive(this)">
                <span class="nav-icon">🎥</span>
                <span>YouTube 下載器 (Code2)</span>
            </a>
            
            <a href="code5-little_mary_web/index.html" class="nav-link" target="preview-frame" onclick="setActive(this)">
                <span class="nav-icon">🎰</span>
                <span>小瑪莉網頁版 (Code5)</span>
            </a>
            
            <a href="code6-food_website/index.html" class="nav-link" target="preview-frame" onclick="setActive(this)">
                <span class="nav-icon">🍽️</span>
                <span>宅生活悠閒時光 (Code6)</span>
            </a>
            
            <a href="code8-stock_tracker/templates/index.html" class="nav-link" target="preview-frame" onclick="setActive(this)">
                <span class="nav-icon">📈</span>
                <span>股價查詢系統 (Code8)</span>
            </a>
        </div>
        
        <!-- 右方展示區 -->
        <div class="content">
            <div class="iframe-wrapper">
                <div class="welcome-screen" id="welcome">
                    <h2>WELCOME</h2>
                    <p>請從左方選擇一個專案來開始體驗 🚀</p>
                </div>
                <iframe name="preview-frame" class="content-frame" onload="hideWelcome()"></iframe>
            </div>
        </div>
    </div>
    
    <script>
        function setActive(element) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            element.classList.add('active');
            
            // Show a brief loading effect or just hide welcome
            document.getElementById('welcome').style.opacity = '0';
        }
        
        function hideWelcome() {
            // Once iframe loads something, ensure welcome screen is hidden
            const welcome = document.getElementById('welcome');
            if(welcome.style.opacity !== '0') {
                welcome.style.opacity = '0';
            }
        }
    </script>
</body>
</html>
